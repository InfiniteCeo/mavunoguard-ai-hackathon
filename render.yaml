services:
  - type: web
    name: mavunoguard-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SENTINEL_CLIENT_ID
        sync: false
      - key: SENTINEL_CLIENT_SECRET
        sync: false
      - key: SENTINEL_TOKEN_URL
        value: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      - key: SENTINEL_STATS_URL
        value: https://sh.dataspace.copernicus.eu/statistics/v1
      - key: SATELLITE_MAX_CLOUD
        value: "35"
